<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net Banking- Session Storage</title>
</head>
<body>
    <h2>Net Banking Login-Session Storage</h2>
    <input type="text" id="username" placeholder="Enter Username">
    <br><br>
    <input type="password" id="password" placeholder="Enter Password">
    <br><br>
    <button onclick="login()">Login</button>
    <button onclick="showData()">Show Storage Data</button>
    <button onclick="logout()">Logout</button>
    <p id="message"></p>
   <script>
        // LOGIN
        function login() {
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;

            if (username === "Lokesh Varma" && password === "220311") {
                sessionStorage.setItem("username", username);
                document.getElementById("message").innerText =
                    "Login Successful! Welcome " + username;
            } 
            else {
                document.getElementById("message").innerText =
                    "Invalid Username or Password";
            }
        }

        // SHOW DATA
        function showData() {
            let sessionUser = sessionStorage.getItem("username");
            document.getElementById("message").innerText =
                "Session Storage: " + sessionUser;
        }

        // LOGOUT
        function logout() {
            // Remove session only
            sessionStorage.removeItem("username");
            document.getElementById("message").innerText =
                "Logged Out. Session Storage is cleared.";
        }
    </script>

</body>
</html>
