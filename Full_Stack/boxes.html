<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .header{
            background-color:blue;
            color:white;
            text-align: center;

        }
        .nav{
            display:flex;
            justify-content:space-around;
        }
        /*Main Layout*/
        .main{
            display: grid;
            grid-template-columns: 75% 25%;
        }
        /*Left Side*/
        .left{
            display:grid;
            grid-template-columns: 1fr 1fr 1fr;
        }
        /*Small Boxes*/
        .box{
            height: 300px;
            background-color: skyblue;
            border: 2px solid white;

            display:flex;
            justify-content:center; 
            align-items:center;

        }
        .content{
            height: 170px;
            background-color: yellow;
            grid-column: 1/4;
            display:flex;   
            justify-content:center;
            align-items:center;
        }
        /* Sidebar */
        .sidebar {
            background-color: lightgreen;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Footer */
        .footer{
            height: 40px;
            background-color: blue;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
        }


    </style>
</head>
<body>
    
    <div class="header">
        <h1>HEADER ELEMENT</h1>
        <div class="nav">
            <div>Home</div>
            <div>About</div> 
            <div>Login</div>
        </div>
        </div>
        <div class="main">
              <div class="left">
                <div class="box">Smallbox1</div>
                <div class="box">Smallbox2</div>    
                <div class="box">Smallbox3</div>
                <div class="content">Main Content</div>   
              </div>
              <div class="sidebar">
                 Side bar
              </div>
                  
        </div>
       <div class="footer">
        Footer
        </div>
          
    </div>
</body>
</html>
