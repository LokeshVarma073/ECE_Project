 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Document</title>
     <style>
        .header{
            background-color:red;
            color:white;
            height: 100px;
            text-align: center;
        }
        .nav{
            display:flex;
            background-color: red;
            justify-content:space-around;
        }
        .main{ 
            display: flex;
            height: 80px;

        }
        .left{
            width: 50%;
            background-color: lightgray;
            grid-template-columns: 1fr 1fr;
            text-align: center;
        }
        .right{
            width: 50%;
            background-color: wheat;
            text-align: center;
        }
        .colors{
            display: flex;
            height: 100px;
            width: 100%;
        }
        .blue{
            width: 25%;
            background-color: blue;
            color: white;
            text-align: center;
            padding-top: 35px;
        }
        .red{
            width: 25%;
            background-color: red;
            color: white;
            text-align: center;
            padding-top: 35px;
        }
        .green{
            width: 25%;
            background-color: green;
            color: white;
            text-align: center;
            padding-top: 35px;
        }
        .yellow{
            width: 25%;
            background-color: yellow;
            color: white;
            text-align: center;
            padding-top: 35px;
        }
        .boxes{
            display: flex;
            height: 100px;
        }
        .box{
            width: 20%;
            background-color: skyblue;
            text-align: center;
            padding-top: 40px;
        }
        .footer{
            height:80px;
            background-color: blue;
            color: white;
            display: flex;
            text-align: center;
            justify-content: center;
        }
     </style>

 </head>
 <body>
    <div class="header">
        <h1>Header</h1>
        </div>
     <div class="nav">
        <div>Home</div>
        <div>About</div>
        <div>Login</div>
      </div>

    <div class="main">
           <div class="left">Left</div>

           <div class="right">Right</div>
    </div>

    <div class="colors">
        <div class="blue">Blue</div>    
        <div class="red">Red</div>
        <div class="green">Green</div>
        <div class="yellow">Yellow</div>
    </div>

    <div class="boxes">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>
        <div class="box">Box 5</div>
    </div>

    <div class="footer">
        <h2>Footer</h2>
    </div>


 </body>
 </html>
